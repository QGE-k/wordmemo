# Render 免费版 24 小时保活
# Render 免费实例闲置约 15 分钟后会休眠，休眠后首次请求冷启动要 30-50 秒，
# 导致 App 切换页面卡顿并弹"服务唤醒中"。本工作流每 10 分钟 ping 一次健康检查接口，
# 让实例始终保持在 15 分钟休眠阈值内（10 分钟 < 15 分钟），服务常驻不冷启动。
# 频率权衡：公开仓库 Actions 免费无时长限制；私有仓库每月限 2000 分钟，
# 每 10 分钟一次约月耗 576 分钟，远低于上限，且足以防休眠。前端还有 3 分钟心跳兜底。
name: keep-render-awake

on:
  schedule:
    - cron: '*/10 * * * *'  # 每 10 分钟一次（< Render 15 分钟休眠阈值）
  workflow_dispatch:         # 支持手动触发

jobs:
  ping:
    name: Ping Render
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          # 命中 /api/ping（轻量健康检查），冷启动时也走完整初始化唤醒服务
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 90 --max-time 120 \
            https://wordmemo-bbpn.onrender.com/api/ping || true)
          echo "ping http_code=$code"
          # 非 2xx 不视为失败，只是打个日志；真正唤醒由下一次请求完成
          exit 0