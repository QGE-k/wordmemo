# Render Blueprint - 一键部署配置
# 使用方法：把代码推到 GitHub 后，在 Render 点 "New" → "Blueprint"，选这个仓库即可
# 详见 DEPLOY.md

services:
  - type: web
    name: wordmemo
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && bash backend/download_ecdict.sh
    startCommand: cd backend && gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 180 --graceful-timeout 30 app:app
    healthCheckPath: /api/stats
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9  # 固定 Python 版本，避免默认用 3.13+ 导致 Pillow 编译失败
      - key: AGNES_API_KEY
        sync: false  # 部署时手动填写（你的 Agnes AI 密钥）
      - key: AGNES_BASE_URL
        value: https://apihub.agnes-ai.com/v1
      - key: AGNES_MODEL
        value: agnes-2.0-flash
      - key: DATABASE_URL
        sync: false  # 部署时手动填写（Neon 连接串）
      - key: BAIDU_OCR_API_KEY
        sync: false  # 部署时手动填写（百度OCR API Key）
      - key: BAIDU_OCR_SECRET_KEY
        sync: false  # 部署时手动填写（百度OCR Secret Key）
      - key: SECRET_KEY
        generateValue: true  # 自动生成随机密钥
